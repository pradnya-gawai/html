<!DOCTYPE html>
<html>
<head>
	<title>Link Color</title>
	<style >
a:link {
  color: green;
  background-color: transparent;
  text-decoration: none;
}

a:visited {
  color: pink;
  background-color: transparent;
  text-decoration: none;
}

a:hover {
  color: red;
  background-color: transparent;
  text-decoration: underline;
}

a:active {
  color: yellow;
  background-color: transparent;
  text-decoration: underline;
}

	</style>
</head>
<body style=" font-family: cursive; text-align: center;">
<h2>Link Color Properties</h2>
<a href="https://www.google.com">Google Page</a>
</body>
</html>
