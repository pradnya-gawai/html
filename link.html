<!DOCTYPE html>
<html>
<head>
	<title>Anchor Tag</title>
	<style >
		body{
			background-color: #dcdcdc;
			text-align:  center;
			font-family: cursive;
			font-size: 20px;
		}
	</style>
</head>
<body>
<h2> Html Links</h2>
<a href="https://www.w3schools.com">this is link</a><br>
 <p><strong>Target Attribute </strong>
 	<pre>
 		<a href="https://www.w3schools.com/html/html_links.asp" target="_self">_self</a>
 		<a href="https://www.w3schools.com/html/html_links.asp" target="_blank">_blank</a>
 		<a href="https://www.w3schools.com/html/html_links.asp " target="_parent">_parent</a>
 		<a href=" https://www.w3schools.com/html/html_links.asp" target="_top">_top</a>
 	</pre></p>
 	<p> Image as link</p>
 	<a href="https://www.google.com/" atl="google" target="_blank"><img src="google_logo.png" height="50px" width="px";>
 	</a>
</body>
</html>
