<!DOCTYPE html>
<html>
<head>
	<title>List</title>
</head>
<body style="background-color: rgb(240,240,240); font-family: cursive;">
	<h2 >An Ordered List</h2>
	<ol start="10">
		<li>item one
		<ol type="a">
			<li>1.1</li>
			<li>1.2</li>
		</ol>
	</li>

		<li>item second</li>
		<li>item thrid</li>
	</ol>
	<h2>An Unorderd List</h2>
	<ul style=" list-style-type:none; ">
		<li>Item</li>
		<li>Item</li>
		<li>Item</li>

	</ul>
	<h2>Discription List</h2>
	<dl>
		<dt>Dehli</dt>
		<dd>Capital Of India</dd>
		<dt> Tokyo</dt>
		<dd>Capital Of Japan</dd>
	</dl>

</body>
</html>
